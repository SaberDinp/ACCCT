name: ACCC Telemetry desktop packages

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to check
        type: choice
        default: all
        options: [all, mac-arm64, mac-x64, win-x64, linux-x64, linux-arm64]
  pull_request:
    paths:
      - 'desktop/**'
      - 'telemetry/**'
      - 'web/**'
      - 'assets/**'
      - 'export_templates/**'
      - 'main.py'
      - 'requirements*.txt'
      - 'tests/test_desktop_runtime.py'
      - 'tests/test_windows_bundle.py'
      - 'tests/test_linux_bundle.py'
      - 'tests/test_tracks.py'
      - 'tests/test_utf8_io.py'
      - '.gitattributes'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = [
              dict(target='mac-arm64', runner='macos-15', architecture='arm64', platform='mac',
                   python='.venv-ci/bin/python', app_directory='mac-arm64'),
              dict(target='mac-x64', runner='macos-15-intel', architecture='x64', platform='mac',
                   python='.venv-ci/bin/python', app_directory='mac'),
              dict(target='win-x64', runner='windows-latest', architecture='x64', platform='win',
                   python='.venv-ci/Scripts/python.exe', app_directory='win-unpacked'),
              dict(target='linux-x64', runner='ubuntu-24.04', architecture='x64', platform='linux',
                   python='.venv-ci/bin/python', app_directory='linux-unpacked'),
              dict(target='linux-arm64', runner='ubuntu-24.04-arm', architecture='arm64', platform='linux',
                   python='.venv-ci/bin/python', app_directory='linux-arm64-unpacked'),
          ]
          requested = os.environ['REQUESTED_TARGET']
          selected = [target for target in targets if requested in ('all', target['target'])]
          if not selected:
              raise SystemExit(f'Unknown desktop target: {requested}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': selected}) + '\n')
          PY
  package:
    needs: targets
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUNBUFFERED: '1'
      ACCC_SMOKE_OUTPUT: artifacts/desktop-package
      ACCC_SMOKE_VIDEO: artifacts/desktop-package/sample.mp4
      ACCC_UPGRADE_OUTPUT: artifacts/desktop-package/upgrade-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt
            desktop/requirements-windows.lock.json
            desktop/requirements-linux-*.lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          architecture: ${{ matrix.architecture }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create isolated build environment
        run: python -m venv .venv-ci
      - name: Install Mac dependencies for the release OS floor
        if: matrix.platform == 'mac'
        run: ${{ matrix.python }} desktop/prepare_mac_dependencies.py
      - name: Install Windows or Linux build dependencies
        if: matrix.platform != 'mac'
        run: ${{ matrix.python }} -m pip install -r requirements-desktop.txt -r requirements-dev.txt
      - name: Install Linux packaging and desktop test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm xvfb xauth dbus-x11
          sudo gem install fpm --version 1.18.0 --no-document
      - run: npm ci --prefix desktop
      - name: Test lifecycle, migration, track data, and packaging contracts
        run: ${{ matrix.python }} -m pytest -q tests/test_desktop_runtime.py tests/test_imports.py tests/test_download_errors.py tests/test_review_audio.py tests/test_windows_bundle.py tests/test_linux_bundle.py tests/test_tracks.py tests/test_track_inference.py tests/test_reference_library.py tests/test_video_watch.py tests/test_catalog.py tests/test_utf8_io.py
      - run: npm test --prefix desktop
      - name: Create redistributable video fixture for packaged UI checks
        run: ${{ matrix.python }} desktop/create_smoke_video.py artifacts/desktop-package/sample.mp4

      - name: Build Mac backend
        if: matrix.platform == 'mac'
        run: ${{ matrix.python }} desktop/build_mac_backend.py
      - name: Check Mac backend
        if: matrix.platform == 'mac'
        run: ${{ matrix.python }} desktop/check_packaged_backend.py desktop/build/backend-macos-${{ matrix.architecture }}/accc-backend/accc-backend
      - name: Build Windows backend
        if: matrix.platform == 'win'
        run: ${{ matrix.python }} desktop/build_windows_backend.py
      - name: Check Windows backend
        if: matrix.platform == 'win'
        run: ${{ matrix.python }} desktop/check_packaged_backend.py desktop/build/backend-windows/python.exe desktop/build/backend-windows/app/desktop/backend.py
      - name: Build Linux backend
        if: matrix.platform == 'linux'
        run: ${{ matrix.python }} desktop/build_linux_backend.py --arch ${{ matrix.architecture }}
      - name: Check Linux backend natively
        if: matrix.platform == 'linux'
        run: ${{ matrix.python }} desktop/check_packaged_backend.py desktop/build/backend-linux-${{ matrix.architecture }}/python/bin/python3 desktop/build/backend-linux-${{ matrix.architecture }}/app/desktop/backend.py

      - name: Package Mac application
        if: matrix.platform == 'mac'
        run: npm run pack:mac:${{ matrix.architecture }} --prefix desktop
      - name: Verify Mac application signature and sealed resources
        if: matrix.platform == 'mac'
        run: codesign --verify --deep --strict --verbose=2 "dist/${{ matrix.app_directory }}/ACCC Telemetry.app"
      - name: Package Windows application
        if: matrix.platform == 'win'
        run: npm run pack:win --prefix desktop
      - name: Package Linux application
        if: matrix.platform == 'linux'
        env:
          USE_SYSTEM_FPM: 'true'
        run: npm run pack:linux:${{ matrix.architecture }} --prefix desktop
      - name: Install and verify the per-user Windows setup
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./.github/scripts/check_windows_installer.ps1
      - name: Install and verify the native Linux DEB
        if: matrix.platform == 'linux'
        run: bash .github/scripts/check_linux_installer.sh
      - name: Check backend inside Mac application
        if: matrix.platform == 'mac'
        run: ${{ matrix.python }} desktop/check_packaged_backend.py "dist/${{ matrix.app_directory }}/ACCC Telemetry.app/Contents/Resources/backend/accc-backend"
      - name: Check backend inside installed Windows application
        if: matrix.platform == 'win'
        shell: pwsh
        run: ${{ matrix.python }} desktop/check_packaged_backend.py "$env:ACCC_INSTALLED_BACKEND_ROOT/python.exe" "$env:ACCC_INSTALLED_BACKEND_ROOT/app/desktop/backend.py"
      - name: Check backend inside installed Linux application
        if: matrix.platform == 'linux'
        run: ${{ matrix.python }} desktop/check_packaged_backend.py "$ACCC_INSTALLED_BACKEND_ROOT/python/bin/python3" "$ACCC_INSTALLED_BACKEND_ROOT/app/desktop/backend.py"
      - name: Check packaged Mac UI
        if: matrix.platform == 'mac'
        run: node desktop/check_desktop.cjs "dist/${{ matrix.app_directory }}/ACCC Telemetry.app/Contents/MacOS/ACCC Telemetry"
      - name: Check installed Windows UI
        if: matrix.platform == 'win'
        shell: pwsh
        run: node desktop/check_desktop.cjs "$env:ACCC_INSTALLED_EXECUTABLE"
      - name: Check installed Linux UI with sandbox enabled
        if: matrix.platform == 'linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node desktop/check_desktop.cjs "$ACCC_INSTALLED_EXECUTABLE"
      - name: Check Mac upgrade with an existing cached Monitor interface
        if: matrix.platform == 'mac'
        run: node desktop/check_upgrade_cache.cjs "dist/${{ matrix.app_directory }}/ACCC Telemetry.app/Contents/MacOS/ACCC Telemetry"
      - name: Check Windows upgrade with an existing cached Monitor interface
        if: matrix.platform == 'win'
        shell: pwsh
        run: node desktop/check_upgrade_cache.cjs "$env:ACCC_INSTALLED_EXECUTABLE"
      - name: Check Linux upgrade with an existing cached Monitor interface
        if: matrix.platform == 'linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node desktop/check_upgrade_cache.cjs "$ACCC_INSTALLED_EXECUTABLE"
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ACCC-Telemetry-installers-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Upload desktop check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ACCC-Telemetry-checks-${{ matrix.target }}
          path: artifacts/desktop-package/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
